name: 🐛 Professional Bug Report
description: File a structured report to help us reproduce and fix the bug.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please provide as much detail as possible.
  
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: E.g., The checkout page throws a 500 error when clicking 'Submit' with an empty cart.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Tell us exactly how to trigger the issue.
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity / Impact
      options:
        - Critical (App crashes, data loss)
        - Major (Core functionality broken, workaround exists)
        - Minor (Visual bug, typo, minor annoyance)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Provide details about your operating system, browser, or device.
      placeholder: E.g., macOS 14.2, Chrome 120.0, Production environment.
    validations:
      required: false

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validation
      options:
        - label: I have verified this bug exists on the latest version of the application.
          required: true
